; Copy to supervisord.conf and adjust workspace and executable paths.
; Install supervisor and cloudflared before enabling the optional tunnel.
[unix_http_server]
file=%(here)s/.remote-agent/supervisor.sock
chmod=0600

[supervisord]
logfile=%(here)s/.remote-agent/supervisord.log
pidfile=%(here)s/.remote-agent/supervisord.pid
childlogdir=%(here)s/.remote-agent

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/.remote-agent/supervisor.sock

[program:anywork]
directory=%(here)s
command=/bin/bash %(here)s/scripts/start.sh --bind 127.0.0.1:3210 --workspace %(here)s/..
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/.remote-agent/service.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:anywork-tunnel]
directory=%(here)s
command=cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:3210
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/.remote-agent/tunnel.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
