[package]
name = "anywork-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "anywork_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "=2.12.5", features = ["custom-protocol"] }
tauri-plugin-mobile-system = { path = "../tauri-plugin-mobile-system" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
url = "2"
chrono = "0.4"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
snow = "0.10"
tokio-tungstenite = "0.29"
percent-encoding = "2"
thiserror = "2"
tempfile = "3"
async-trait.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
