[package]
name = "anywork-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "anywork_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "=2.12.5", features = ["custom-protocol"] }
tauri-plugin-mobile-system = { path = "../tauri-plugin-mobile-system" }
tauri-plugin-mobile-auth = { path = "../tauri-plugin-mobile-auth" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
url = "2"
chrono = "0.4"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
snow = "0.10"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
anywork-remote = { path = "../remote" }
percent-encoding = "2"
thiserror = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
tempfile = "3"
async-trait.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[target.'cfg(target_os = "android")'.dependencies]
cybergrid-sdk = { git = "https://github.com/ywateru/CyberGrid.git", rev = "f2a3961536e5c69b13c7dbc661953d9243becbae" }
jni = { version = "0.22", default-features = false }
ndk-context = "0.1"
rustls-platform-verifier = "0.7"

[dev-dependencies]
cybergrid-sdk = { git = "https://github.com/ywateru/CyberGrid.git", rev = "f2a3961536e5c69b13c7dbc661953d9243becbae" }
axum = { version = "0.8", features = ["ws"] }
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
