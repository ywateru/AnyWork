<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>AnyWork · 登录</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #202020; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; }
    main { max-width: 440px; text-align: center; padding-bottom: 5vh; }
    .brand { width: 52px; height: 52px; margin: 0 auto 28px; }
    svg { display: block; width: 100%; height: 100%; }
    h1 { font-size: 26px; font-weight: 600; letter-spacing: -.6px; margin: 0 0 16px; }
    p { font-size: 15px; line-height: 1.8; color: #737373; margin: 0; }
    .wordmark { display: block; font-size: 13px; color: #909090; margin-top: 32px; }
    @media (prefers-color-scheme: dark) { :root { background: #181818; color: #f5f5f5; } p { color: #ababab; } }
    @media (max-height: 400px) { body { padding: 24px; } main { padding: 0; } .brand { margin-bottom: 16px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-hidden="true">{{ICON}}</div>
    <h1>{{TITLE}}</h1>
    <p>{{MESSAGE}}</p>
    <span class="wordmark">AnyWork</span>
  </main>
  <script>try{history.replaceState(null,"","/callback")}catch{}</script>
</body>
</html>
