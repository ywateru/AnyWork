[package]
name = "anywork-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "anywork-desktop"

[dependencies]
anywork-remote = { path = "../remote" }
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
snow = "0.10"
jsonwebtoken = "9.3"
tokio-util = { version = "0.7", features = ["rt"] }

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "system-proxy"] }
url = "2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
sha2 = "0.10"
fs2 = "0.4"
rfd = "0.17"
open = "5"
tauri = { version = "=2.12.5", features = ["custom-protocol", "image-png"] }
tauri-plugin-updater = "2"
semver = "1"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }

[target.'cfg(unix)'.dependencies]
cybergrid-sdk = { git = "https://github.com/ywateru/CyberGrid.git", rev = "2bd6729c6bbee90ed2926410caca883a0a100890" }

libc = "0.2"
