[workspace]
members = ["crates/agent-sdk", "crates/agent-codex", "crates/server", "crates/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
