<style>
#aw-desktop-wireframes{--aw-bg:light-dark(#fff,#202020);--aw-side:light-dark(#f5f5f5,#181818);--aw-surface:light-dark(#fafafa,#252525);--aw-fg:light-dark(#242424,#ededed);--aw-muted:light-dark(#727272,#adadad);--aw-line:light-dark(#e4e4e4,#3c3c3c);--aw-active:light-dark(#e8e8e8,#343434);--aw-primary:light-dark(#242424,#ededed);--aw-primary-fg:light-dark(#fff,#202020);--aw-error:light-dark(#a13a3a,#edaaaa);--aw-space:30px;--aw-side-width:220px;color:var(--aw-fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;isolation:isolate;max-width:100%;}
#aw-desktop-wireframes *{box-sizing:border-box;}
#aw-desktop-wireframes [hidden]{display:none!important;}
#aw-desktop-wireframes button,#aw-desktop-wireframes input,#aw-desktop-wireframes select{font:inherit;color:inherit;}
#aw-desktop-wireframes button{background:var(--aw-bg);border:1px solid var(--aw-line);border-radius:7px;min-height:34px;padding:6px 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:normal;text-align:center;}
#aw-desktop-wireframes button:hover:not(:disabled){background:var(--aw-active);}
#aw-desktop-wireframes button:disabled{opacity:.43;cursor:not-allowed;}
#aw-desktop-wireframes button:focus-visible,#aw-desktop-wireframes select:focus-visible,#aw-desktop-wireframes input:focus-visible,#aw-desktop-wireframes summary:focus-visible{outline:2px solid var(--aw-fg);outline-offset:3px;}
#aw-desktop-wireframes .aw-primary{background:var(--aw-primary);color:var(--aw-primary-fg);border-color:var(--aw-primary);}
#aw-desktop-wireframes .aw-primary:hover:not(:disabled){background:var(--aw-primary);opacity:.87;}
#aw-desktop-wireframes .aw-quiet{border-color:transparent;background:transparent;}
#aw-desktop-wireframes .aw-danger{color:var(--aw-error);}
#aw-desktop-wireframes .aw-icon-button{padding:6px;min-width:32px;min-height:32px;}
#aw-desktop-wireframes svg{flex-shrink:0;}
#aw-desktop-wireframes h1,#aw-desktop-wireframes h2,#aw-desktop-wireframes h3,#aw-desktop-wireframes p{margin:0;}
#aw-desktop-wireframes h1{font-size:23px;line-height:1.4;font-weight:500;letter-spacing:-.4px;}
#aw-desktop-wireframes h2{font-size:15px;font-weight:500;}
#aw-desktop-wireframes h3{font-size:14px;font-weight:500;}
#aw-desktop-wireframes strong{font-weight:500;}
#aw-desktop-wireframes .aw-muted,#aw-desktop-wireframes .aw-caption{color:var(--aw-muted);}
#aw-desktop-wireframes .aw-caption{font-size:12px;}
#aw-desktop-wireframes .aw-preview-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:0 0 12px;color:var(--aw-muted);font-size:12px;}
#aw-desktop-wireframes .aw-preview-bar label{display:flex;align-items:center;gap:8px;}
#aw-desktop-wireframes .aw-preview-bar select{border:1px solid var(--aw-line);border-radius:6px;background:var(--aw-bg);padding:5px 8px;max-width:205px;font-size:12px;}
#aw-desktop-wireframes .aw-window{display:grid;grid-template-columns:var(--aw-side-width) minmax(0,1fr);min-height:610px;background:var(--aw-bg);border:1px solid var(--aw-line);border-radius:11px;position:relative;overflow:clip;}
#aw-desktop-wireframes .aw-sidebar{background:var(--aw-side);border-right:1px solid var(--aw-line);padding:21px 10px 12px;display:flex;flex-direction:column;min-width:0;}
#aw-desktop-wireframes .aw-brand{display:flex;align-items:center;gap:9px;padding:0 9px 25px;font-size:15px;}
#aw-desktop-wireframes .aw-logo{display:block;object-fit:contain;flex-shrink:0;}
#aw-desktop-wireframes .aw-sidebar-body{display:flex;flex-direction:column;gap:5px;flex:1;}
#aw-desktop-wireframes .aw-sidebar button.aw-nav{border:0;background:transparent;width:100%;text-align:left;justify-content:flex-start;padding:9px 10px;gap:9px;min-width:0;}
#aw-desktop-wireframes .aw-sidebar button.aw-nav[aria-current="page"]{background:var(--aw-active);}
#aw-desktop-wireframes .aw-nav-text{display:flex;flex-direction:column;align-items:flex-start;min-width:0;}
#aw-desktop-wireframes .aw-nav-sub{font-size:11px;color:var(--aw-muted);margin-top:2px;}
#aw-desktop-wireframes .aw-sidebar-separator{flex:1;min-height:145px;}
#aw-desktop-wireframes .aw-account-nav{border-top:1px solid var(--aw-line);padding-top:8px;margin-top:6px;}
#aw-desktop-wireframes .aw-mobile-nav{display:none;margin-left:auto;}
#aw-desktop-wireframes .aw-app-body{display:flex;flex-direction:column;min-width:0;}
#aw-desktop-wireframes .aw-titlebar{min-height:48px;padding:0 var(--aw-space);display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--aw-line);font-size:13px;}
#aw-desktop-wireframes .aw-main{padding:var(--aw-space);flex:1;min-width:0;}
#aw-desktop-wireframes .aw-page-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px;}
#aw-desktop-wireframes .aw-page-heading p{margin-top:6px;font-size:13px;color:var(--aw-muted);}
#aw-desktop-wireframes .aw-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;}
#aw-desktop-wireframes .aw-dot{width:6px;height:6px;border-radius:50%;background:var(--aw-fg);display:inline-block;}
#aw-desktop-wireframes .aw-outline-dot{background:transparent;border:1px solid var(--aw-muted);}
#aw-desktop-wireframes .aw-workspace{border:1px solid var(--aw-line);border-radius:9px;padding:22px;}
#aw-desktop-wireframes .aw-workspace-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
#aw-desktop-wireframes .aw-workspace h2{font-size:17px;}
#aw-desktop-wireframes .aw-workspace .aw-context{margin:0 0 18px;font-size:13px;color:var(--aw-muted);}
#aw-desktop-wireframes .aw-local-address{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;}
#aw-desktop-wireframes .aw-local-address code{flex:1;min-width:0;}
#aw-desktop-wireframes .aw-local-address .aw-caption{white-space:nowrap;}
#aw-desktop-wireframes .aw-workspace .aw-local-help{margin:8px 0 0;font-size:12px;color:var(--aw-muted);}
#aw-desktop-wireframes .aw-page-intro{font-size:13px;color:var(--aw-muted);margin-bottom:22px;}
#aw-desktop-wireframes .aw-titlebar h1{font-size:14px;letter-spacing:0;}
#aw-desktop-wireframes .aw-version-row{display:flex;align-items:center;gap:12px;}
#aw-desktop-wireframes .aw-path{display:flex;align-items:center;gap:7px;font-size:12px;overflow-wrap:anywhere;margin-top:18px;color:var(--aw-muted);}
#aw-desktop-wireframes .aw-remote-link{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;border:0;border-bottom:1px solid var(--aw-line);border-radius:0;background:transparent;text-align:left;padding:18px 0;margin:9px 0 20px;}
#aw-desktop-wireframes .aw-remote-link>span{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
#aw-desktop-wireframes details{border-bottom:1px solid var(--aw-line);padding:14px 0;}
#aw-desktop-wireframes summary{display:flex;align-items:center;gap:8px;list-style:none;font-size:13px;}
#aw-desktop-wireframes summary::before{content:"›";font-size:18px;line-height:1;}
#aw-desktop-wireframes details[open]>summary::before{transform:rotate(90deg);}
#aw-desktop-wireframes .aw-connected-details summary .aw-caption{margin-left:auto;text-align:right;}
#aw-desktop-wireframes summary::-webkit-details-marker{display:none;}
#aw-desktop-wireframes details>div,#aw-desktop-wireframes details>p{margin-top:12px;font-size:12px;}
#aw-desktop-wireframes code{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;}
#aw-desktop-wireframes .aw-address{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--aw-surface);border:1px solid var(--aw-line);border-radius:7px;padding:10px 12px;}
#aw-desktop-wireframes .aw-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#aw-desktop-wireframes .aw-small-gap{margin-top:12px;}
#aw-desktop-wireframes .aw-section{margin-top:26px;}
#aw-desktop-wireframes .aw-section-label{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
#aw-desktop-wireframes .aw-connection-row{display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid var(--aw-line);}
#aw-desktop-wireframes .aw-connection-row>div{flex:1;min-width:0;}
#aw-desktop-wireframes .aw-connection-row p{font-size:12px;color:var(--aw-muted);margin-top:2px;}
#aw-desktop-wireframes .aw-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:16px 0;border-bottom:1px solid var(--aw-line);}
#aw-desktop-wireframes .aw-row p{font-size:12px;color:var(--aw-muted);margin-top:4px;}
#aw-desktop-wireframes .aw-switch{display:inline-flex;gap:7px;align-items:center;font-size:12px;white-space:nowrap;}
#aw-desktop-wireframes .aw-switch input{accent-color:var(--aw-fg);width:17px;height:17px;}
#aw-desktop-wireframes .aw-step-list{margin:0;padding-left:21px;display:grid;gap:8px;}
#aw-desktop-wireframes .aw-note{border:1px solid var(--aw-line);border-radius:7px;background:var(--aw-surface);padding:12px 14px;margin-bottom:18px;font-size:13px;}
#aw-desktop-wireframes .aw-note p+p{margin-top:6px;}
#aw-desktop-wireframes .aw-error-text{color:var(--aw-error);}
#aw-desktop-wireframes .aw-field{display:block;margin:0 0 16px;font-size:13px;}
#aw-desktop-wireframes .aw-field>span{display:block;margin-bottom:6px;}
#aw-desktop-wireframes .aw-field-line{display:flex;align-items:center;gap:8px;}
#aw-desktop-wireframes input.aw-input{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--aw-line);border-radius:6px;background:var(--aw-bg);font-size:12px;}
#aw-desktop-wireframes input.aw-input:disabled{background:var(--aw-surface);color:var(--aw-muted);}
#aw-desktop-wireframes .aw-setting-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:16px 0;}
#aw-desktop-wireframes .aw-stage{max-width:500px;margin:35px auto 15px;}
#aw-desktop-wireframes .aw-stage h1{font-size:27px;line-height:1.5;}
#aw-desktop-wireframes .aw-stage>p{color:var(--aw-muted);margin-top:15px;line-height:1.8;font-size:13px;}
#aw-desktop-wireframes .aw-stage .aw-actions{margin-top:24px;}
#aw-desktop-wireframes .aw-steps{display:flex;gap:12px;flex-wrap:wrap;color:var(--aw-muted);font-size:11px;margin-bottom:38px;}
#aw-desktop-wireframes .aw-steps .aw-current{color:var(--aw-fg);}
#aw-desktop-wireframes .aw-diagram{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;text-align:center;border:1px solid var(--aw-line);border-radius:8px;padding:20px;margin:22px 0;}
#aw-desktop-wireframes .aw-computer-node{grid-column:1/-1;border-bottom:1px solid var(--aw-line);padding-bottom:16px;margin-bottom:16px;display:flex;flex-direction:column;align-items:center;gap:6px;}
#aw-desktop-wireframes .aw-end-node{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;}
#aw-desktop-wireframes .aw-loading-line{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--aw-muted);font-size:13px;}
#aw-desktop-wireframes .aw-feedback{min-height:36px;padding:4px var(--aw-space) 12px;color:var(--aw-muted);font-size:12px;}
#aw-desktop-wireframes .aw-dialog{position:absolute;top:110px;left:50%;transform:translateX(-50%);margin:0;background:var(--aw-bg);color:var(--aw-fg);border:1px solid var(--aw-line);border-radius:11px;padding:24px;width:min(420px,calc(100% - 32px));max-height:calc(100% - 48px);box-shadow:0 12px 48px #0002;}
#aw-desktop-wireframes .aw-dialog::backdrop{background:#0004;}
#aw-desktop-wireframes .aw-dialog h2{font-size:18px;margin-bottom:12px;}
#aw-desktop-wireframes .aw-dialog p{font-size:13px;color:var(--aw-muted);margin-bottom:12px;}
#aw-desktop-wireframes .aw-dialog .aw-actions{justify-content:flex-end;margin-top:20px;}
#aw-desktop-wireframes .aw-empty{padding:23px 0;font-size:13px;color:var(--aw-muted);}

#aw-desktop-wireframes .aw-update-state{margin:22px 0 17px;}
#aw-desktop-wireframes .aw-update-state p{margin-top:6px;font-size:13px;color:var(--aw-muted);}
@media(max-width:760px){#aw-desktop-wireframes{--aw-space:23px;--aw-side-width:200px;}#aw-desktop-wireframes .aw-workspace{padding:18px;}#aw-desktop-wireframes .aw-page-heading{align-items:flex-start;flex-direction:column;}}

function introduction(){return `<section class="aw-stage">${steps(0)}<h1>把这台电脑的工作区<br>带到你的每一台设备</h1><p>会话、文件与终端由这台电脑处理。<br>本机在浏览器工作，手机或网页可继续同一份工作。</p><div class="aw-diagram" aria-label="设备关系示意，不是在线设备状态"><div class="aw-computer-node">${icon('monitor')}<strong>这台电脑</strong><span class="aw-caption">运行 Agent · 保存工作内容</span></div><div class="aw-end-node">${icon('panel-top')}<strong>本机浏览器</strong><span class="aw-caption">本地使用</span></div><div class="aw-end-node">${icon('smartphone')}<strong>手机 / 其他网页</strong><span class="aw-caption">同账号 · 加密连接</span></div></div><div class="aw-actions">${button('开始使用','begin','aw-primary')}</div><p class="aw-caption">登录并准备工作区后默认开启远程，可随时关闭。<br>云端处理账号与必要连接元数据，工作内容留在设备。</p></section>`;}
function login(){const waiting=state.scene==='authorizing';return `<section class="aw-stage">${steps(1)}<h1>${waiting?'在浏览器中完成登录':'登录你的 AnyWork 账号'}</h1><p>注册和登录在系统浏览器中完成。<br>登录后，这台电脑会准备本地工作区，并默认尝试开启远程访问。</p>${waiting?`<div class="aw-loading-line" role="status">${icon('loader-circle')}正在等待浏览器完成登录…</div><div class="aw-actions">${button('取消登录','cancel-login')}</div>`:`<div class="aw-actions">${button('登录已有账号','sign-in','aw-primary')}${button('创建账号','register')}</div>`}<p class="aw-caption">账号凭据只保留在本次应用运行期间。重启后需要重新登录。</p></section>`;}
function prepare(){const failed=state.scene==='failed';return `<section class="aw-stage">${steps(2)}<h1>${failed?'工作区还没有就绪':'正在准备你的工作区'}</h1><p>${failed?'本地服务未能启动。检查工作目录、端口与程序路径后重试。':'已登录示例账号，正在启动或核验本地服务。<br>本地就绪后会尝试开启远程，远程失败不影响本机使用。'}</p>${failed?`<div class="aw-actions">${button('重试准备','retry-prepare','aw-primary')}${button('打开设置','goto-settings')}</div><details><summary class="cursor-interaction">诊断详情</summary><p>示例：本机端口已被其他程序占用。请在设置中核对端口；不会停止未知进程。</p></details>`:`<div class="aw-loading-line" role="status">${icon('loader-circle')}正在核验本地服务…</div>`}</section>`;}

}

const unavailable=!known(),errored=state.scene==='remote-error';const status=unavailable?'远程状态暂不可用':errored?'远程访问未开启':state.remote?'远程访问已开启':'远程访问已关闭';
const connections=unavailable?'<p class="aw-empty" role="status">连接状态暂不可用。恢复读取后显示实际活动连接。</p>':!state.remote?'<p class="aw-empty">开启远程后可查看活动连接。</p>':state.connections===0?'<p class="aw-empty">还没有远程设备连接。按上方步骤在其他设备中连接。</p>':`<div class="aw-connection-row">${icon('smartphone')}<div><strong>iPhone / iPad 浏览器</strong><p>开始于 14:32</p></div><span class="aw-status"><span class="aw-dot"></span>已连接</span></div><div class="aw-connection-row">${icon('monitor')}<div><strong>网页客户端</strong><p>开始于 14:38</p></div><span class="aw-status"><span class="aw-dot"></span>已连接</span></div>`;
return `<p class="aw-page-intro">从手机或其他网页连接这台电脑。</p><div class="aw-row"><div><h2>${status}</h2><p>${unavailable?'恢复状态前无法更改远程访问。':state.remote?'关闭会中断当前远程连接，本地工作不受影响。':'本次登录内保持关闭，随时可以手动开启。'}</p></div>${unavailable?'<span class="aw-caption" role="status">状态未知</span>':`<label class="aw-switch cursor-interaction"><input type="checkbox" role="switch" aria-label="允许其他设备远程访问" data-control="remote" ${state.remote?'checked':''} ${!running()?'disabled':''}><span>${state.remote?'已开启':'已关闭'}</span></label>`}</div>${errored?note(`<p role="alert">暂时无法连接设备协调服务。</p><div class="aw-actions aw-small-gap">${button('重试开启远程','retry-remote','aw-primary')}</div><details><summary class="cursor-interaction">诊断详情</summary><p>示例代码：REMOTE_ENABLE_GRID_CONFIG_UNAVAILABLE</p></details>`):''}<section class="aw-section"><div class="aw-section-label"><h2>其他设备的账号入口</h2></div><div class="aw-address"><code>${unavailable?'账号入口暂不可用':'https://example.invalid/app/'}</code><div class="aw-actions">${button(icon('copy'),'copy-portal','aw-icon-button',unavailable)}${button(`${icon('external-link')}打开`,'open-portal','',unavailable)}</div></div><p class="aw-caption aw-small-gap">入口为示例占位，设计预览不会打开网页。</p><details><summary class="cursor-interaction">如何连接其他设备</summary><div><ol class="aw-step-list"><li>在手机或其他电脑打开账号入口。</li><li>登录同一账号，选择这台电脑。</li><li>首次连接或身份变化时核对本机身份。</li></ol></div></details><details><summary class="cursor-interaction">本机身份核对</summary>${state.remote&&known()?`<div class="aw-address"><div><span class="aw-caption">设备身份 / 公钥（示例）</span><p><code>device-example · key-example</code></p></div>${button('复制','copy-identity')}</div><p class="aw-muted">首次连接或公钥变化时，与另一台设备上显示的信息核对。</p>`:'<p class="aw-muted">开启远程且状态可用后，可查看本机身份。</p>'}</details></section><details class="aw-section aw-connected-details"><summary class="cursor-interaction"><strong>已连接设备</strong><span class="aw-caption">${unavailable?'连接状态暂不可用':!state.remote?'远程已关闭':`${state.connections} 个活动连接`}</span></summary><div>${connections}<p class="aw-caption aw-small-gap">每行是一个活动加密连接，同一设备可以建立多个连接。设备类型仅用于显示。</p></div></details>`;
}
function settingField(key,label,value,locked,folder=true){return `<label class="aw-field"><span>${label}</span><div class="aw-field-line"><input id="aw-field-${key}" class="aw-input" ${key==='port'?'type="number" min="1024" max="65535"':'type="text"'} value="${escape(value)}" ${locked?'disabled':''}>${folder?button(icon('folder-open'),'choose-'+key,'aw-icon-button',locked):''}</div></label>`;}
function escape(value){return String(value).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');}
function settings(){const locked=settingsLocked();return `<p class="aw-page-intro">工作目录、服务位置与连接说明。</p>${state.external?note('当前复用外部服务。可以保存连接配置；Native 会重新核验服务身份，不停止或改写外部进程。保存规则以实际 Native 的 owned / 启动状态为准。'):locked?note(known()?'本应用正在运行或准备本地服务。停止后才能修改目录和端口。':'服务状态暂不可用，暂时不能修改或保存设置。'):''}<section>${settingField('workspace','工作目录',drafts.workspace,locked)}${settingField('data','服务数据目录',drafts.data,locked)}${settingField('port','本机端口',drafts.port,locked,false)}<div class="aw-setting-footer">${button('保存本机设置','save-settings','',locked)}<span class="aw-caption">目录与端口使用已保存配置。</span></div></section><details><summary class="cursor-interaction">服务程序</summary><div>${settingField('program','服务程序路径',drafts.program,locked)}${button('保存程序位置','save-program','',locked)}</div></details><details><summary class="cursor-interaction">连接与隐私说明</summary><p>工作内容在设备上处理；远程连接端到端加密。云端处理账号与必要连接元数据。</p><p>登录并准备本地服务后默认尝试开启远程，可随时关闭；关闭不影响本地服务。</p><p>账号凭据与设备私钥仅保留在内存。客户端重启后需重新登录，新的登录会再次默认尝试开启远程。</p></details>${owned()?`<section class="aw-section"><div class="aw-row"><div><h2>本应用启动的服务</h2><p>停止会中断本地工作区和远程访问。任务执行中或状态未知时不允许停止。</p></div>${button('停止服务','stop-service','aw-danger',!known())}</div></section>`:''}`;}
function updates(){return `<p class="aw-page-intro">后台下载，由你决定何时安装。</p><div class="aw-version-row"><img class="aw-logo" src="${logoData}" width="30" height="30" alt=""><span class="aw-caption">当前版本 0.1.25 · 示例</span></div><section class="aw-update-state"><h2>${state.updateReady?'新版本已准备好':'让 AnyWork 保持更新'}</h2><p>${state.updateReady?'更新包已下载并通过签名校验，可稍后安装。':'自动检查正式发行版。安装前会请你确认。'}</p></section>${state.updateBusy?note('<p role="alert">仍有任务执行或等待确认，暂时不能安装。</p><p class="aw-caption">更新包会保留。待任务结束、状态确认后再试。</p>'):''}<div class="aw-actions">${state.updateReady?button(`${icon('refresh-cw')}更新并重启`,'install-update','aw-primary'):button('检查更新','check-update')}${state.updateReady?button('稍后提醒','defer-update'):''}${button('发行说明','release-notes','aw-quiet')}</div><div class="aw-row aw-section"><div><h2>自动检查并后台下载</h2><p>启动后及每 6 小时检查一次；安装始终需要确认。</p></div><label class="aw-switch cursor-interaction"><input type="checkbox" role="switch" data-control="auto-update" aria-label="自动检查并后台下载" ${state.autoUpdate?'checked':''}><span>${state.autoUpdate?'开启':'关闭'}</span></label></div>${state.updateReady?'<details><summary class="cursor-interaction">更新内容</summary><p>示例发行说明：连接稳定性与界面体验改进。</p></details>':''}`;}
function account(){if(state.scene==='unsupported')return workspace();return signedIn()?`<div class="aw-row"><div><h2>示例账号</h2><p>已登录 · 账号凭据仅在本次运行中保留</p></div>${button('退出账号','logout','aw-danger')}</div><p class="aw-caption aw-small-gap">退出账号会关闭远程访问，本地服务和工作数据会保留。退出后需重新登录，才能再次从桌面打开工作区。</p>`:`<p class="aw-page-intro">${state.scene==='authorizing'?'正在等待系统浏览器完成登录。':'在系统浏览器中登录，开始准备这台电脑。'}</p><div class="aw-actions">${state.scene==='authorizing'?button('取消登录','cancel-login'):button('登录已有账号','sign-in','aw-primary')}${state.scene==='authorizing'?'':button('创建账号','register')}</div>`;}
function render(){nav();const names={workspace:signedIn()?'这台电脑':'开始使用',remote:'远程访问',settings:'本机设置',updates:'软件更新',account:'账号'};root.querySelector('#aw-breadcrumb').textContent=names[state.page];content.innerHTML=state.page==='remote'?remote():state.page==='settings'?settings():state.page==='updates'?updates():state.page==='account'?account():workspace();sceneSelect.value=state.scene;root.querySelector('[data-act="toggle-nav"]').setAttribute('aria-expanded',String(state.navExpanded));root.style.setProperty('--aw-side-width',design.sidebarWidth+'px');root.style.setProperty('--aw-space',design.compact?'22px':'30px');if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});root.querySelector('[data-act="copy-portal"]')?.setAttribute('aria-label','复制账号入口');for(const key of ['workspace','data','program'])root.querySelector(`[data-act="choose-${key}"]`)?.setAttribute('aria-label',`选择${{workspace:'工作目录',data:'服务数据目录',program:'服务程序路径'}[key]}`);}
function setScene(scene){if(!validScenes.includes(scene))return;state={...state,scene,page:['remote-error','remote-empty','remote-off'].includes(scene)?'remote':scene==='update-busy'?'updates':'workspace',remote:!['remote-off','remote-error','intro','login','authorizing','prepare','failed','unsupported'].includes(scene),connections:scene==='remote-empty'?0:2,localStopped:false,external:scene==='external',needsVerification:false,updateBusy:scene==='update-busy',updateReady:scene==='update-busy'||state.updateReady};announce('');render();save();}
function showDialog(title,body,label,action,cancelLabel='取消'){lastFocus=document.activeElement;dialogAction=action;dialogContent.innerHTML=`<h2 id="aw-dialog-title">${title}</h2>${body}<div class="aw-actions">${button(cancelLabel,'dialog-cancel')}${button(label,'dialog-confirm','aw-primary')}</div>`;dialog.showModal();dialog.querySelector('[data-act="dialog-cancel"]').focus();}
function closeDialog(){dialog.close();dialogAction=null;if(lastFocus?.isConnected)lastFocus.focus();}
dialog.addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
root.addEventListener('click',e=>{
const pageButton=e.target.closest('[data-page]');if(pageButton){const nextPage=pageButton.dataset.page;if(nextPage===state.page)return;navigate(()=>{state.page=nextPage;state.navExpanded=false;announce('');render();save();});return;}
const target=e.target.closest('[data-act]');if(!target||target.disabled)return;const act=target.dataset.act;
if(act==='dialog-cancel'){closeDialog();return;}if(act==='dialog-confirm'){const action=dialogAction;closeDialog();action?.();return;}
if(act==='toggle-nav'){state.navExpanded=!state.navExpanded;render();save();return;}
if(act==='begin'){setScene('login');return;}if(act==='sign-in'||act==='register'){setScene('authorizing');announce('原型演示：实际产品会打开系统浏览器。可使用上方场景选单继续预览。');return;}if(act==='cancel-login'){setScene('login');announce('已取消本次登录演示。');return;}
if(act==='goto-settings'||act==='goto-remote'){navigate(()=>{state.page=act==='goto-settings'?'settings':'remote';render();save();});return;}
if(act==='retry-prepare'){state.localStopped=false;setScene('prepare');announce('原型演示：正在准备。可用场景选单切换“工作区已就绪”。');return;}
if(act==='retry-remote'){state.scene='ready';state.remote=true;state.connections=0;render();save();announce('原型演示：远程访问已开启，尚无活动连接。');return;}
if(act==='open-workspace'||act==='open-portal'){announce('原型演示：实际产品将在系统浏览器中打开'+(act==='open-workspace'?'本地工作区。':'账号入口。'));return;}
if(act.startsWith('copy-')){announce('原型演示：'+({ 'copy-local':'本地裸地址','copy-portal':'账号入口','copy-identity':'设备身份与公钥'}[act]||'内容')+'已复制（未写入系统剪贴板）。');return;}
if(act.startsWith('choose-')){announce('原型演示：实际产品将打开系统文件选择器。');return;}
if(act==='save-settings'||act==='save-program'){if(settingsLocked())return;drafts=fields();const port=Number(drafts.port);if(!Number.isInteger(port)||port<1024||port>65535){announce('本机端口须为 1024–65535 的整数。');return;}const keys=act==='save-settings'?['workspace','data','port']:['program'];for(const key of keys)state.savedConfig[key]=drafts[key];if(state.external&&act==='save-settings')state.needsVerification=true;save();announce(state.external?'原型演示：配置已保存。Native 将重新核验连接；外部进程不会被停止。':'原型演示：设置已保存。');return;}
if(act==='stop-service'){if(state.external||!owned())return;showDialog('停止本地服务？','<p>这会中断本地工作区和当前远程连接。</p><p>任务执行中或状态未知时会拒绝停止。独立启动的外部服务不在此处停止。</p>','确认停止',()=>{if(state.external||state.updateBusy||!known()){announce('原型演示：外部服务、任务执行中或状态未知，无法停止服务。');return;}state.localStopped=true;state.remote=false;state.connections=0;render();save();announce('原型演示：本地服务已停止，现在可以编辑设置。');});return;}
if(act==='check-update'){state.updateReady=true;render();save();announce('原型演示：已检查并下载示例更新包。');return;}
if(act==='defer-update'){announce('原型演示：稍后提醒，当前工作可以继续。');return;}
if(act==='release-notes'){announce('原型演示：实际产品将打开发行说明。');return;}
if(act==='install-update'){if(state.updateBusy||!known()){announce('原型演示：任务仍在执行或状态未知，暂不能安装；更新包会保留。');return;}showDialog('更新并重新启动？','<p>安装已下载并验证的更新。请先确认本应用管理的任务已经空闲。</p><p>重启后会重新介绍并要求登录；本地服务就绪后默认尝试开启远程一次，可随时关闭。</p><p>工作目录、会话与本地数据会保留。</p>','确认更新',()=>{setScene('intro');state.updateReady=false;render();announce('原型演示：更新并重启已完成，回到介绍阶段。');});return;}
if(act==='logout'){showDialog('退出这台电脑的账号？','<p>远程访问和活动远程连接将结束。本地服务及工作数据会保留。</p>','退出账号',()=>{setScene('login');announce('原型演示：已退出账号；本地服务未被强制停止。');});}
});
root.addEventListener('change',e=>{if(e.target===sceneSelect){const nextScene=e.target.value;sceneSelect.value=state.scene;navigate(()=>setScene(nextScene));return;}if(e.target.dataset.control==='remote'){const intended=e.target.checked;if(!intended&&state.connections>0){e.target.checked=true;showDialog('关闭远程访问？',`<p>这会终止当前 ${state.connections} 个远程连接，并停止接受新连接。</p><p>本地工作区仍可使用。本次登录期间会保持关闭，直到你手动开启。</p>`,'关闭远程访问',()=>{state.remote=false;state.connections=0;state.scene='remote-off';render();save();announce('原型演示：远程已关闭，本地工作不受影响。');});}else{state.remote=intended;state.connections=0;state.scene=intended?'remote-empty':'remote-off';render();save();announce(intended?'原型演示：远程访问已开启。':'原型演示：远程访问已关闭。');}return;}if(e.target.dataset.control==='auto-update'){state.autoUpdate=e.target.checked;render();save();announce('原型演示：更新偏好已保存。');}});
root.addEventListener('input',e=>{if(e.target.id?.startsWith('aw-field-'))drafts=fields();});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);drafts={...state.savedConfig};render();}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(design,'sidebarWidth',{label:'侧栏宽度',min:200,max:240,step:10,unit:'px'});tweak.addToggle(design,'compact',{label:'紧凑布局'});}
})();
</script>
