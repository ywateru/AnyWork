 function panelView(){let body='',title='';if(state.panel==='files'){title='workspace-layout.md';body='<div class="aw-file-tree"><p>'+icon('folder-open')+' docs / design</p><p class="aw-code-line">'+icon('file-text')+' workspace-layout.md</p><p>'+icon('file-text')+' interaction-states.md</p></div><h2>统一工作区外壳</h2><p style="margin-top:12px">让设备上下文、项目导航和会话工具各自只有一个位置。</p><pre>ApplicationShell\n  Sidebar\n    DeviceContext\n    ProjectThreads\n    AccountMenu\n  Workspace\n    ConversationHeader\n    Conversation\n    ContextPanel</pre><button type="button" data-action="edit-file">编辑文件</button>'}else if(state.panel==='changes'){title='变更';body='<p class="aw-muted">1 个文件有改动 · 示例</p><div class="aw-line"></div><p>docs/design/workspace-layout.md</p><pre>+ 品牌与账号共用侧栏位置\n+ 当前电脑在设备切换器中显示\n− 移除重复的账号顶栏</pre><button type="button" data-action="review-change">查看完整差异</button>'}else{title='终端';body='<p class="aw-muted">/workspace/product-demo</p><pre>$ npm run build\n\n✓ 编译完成\n✓ 静态资源生成完成\n\n终端内容为示例，不会执行命令。</pre><button type="button" data-action="terminal-demo">输入命令</button>'}return '<aside class="aw-panel" aria-label="'+title+'"><div class="aw-panel-head"><span>'+title+'</span><button type="button" class="aw-quiet" data-action="close-panel" aria-label="关闭右侧面板">'+icon('x')+'</button></div><div class="aw-panel-body">'+body+'</div></aside>'}
 function workView(){const banner=disconnected()?'<div class="aw-banner" role="status">'+icon('unplug')+'<span>'+ (state.page==='expired'?'连接授权已过期。对话和草稿仍在这里。':'与工作电脑的连接已中断，当前内容暂不可更新。')+'</span><span class="aw-spacer"></span><button type="button" data-action="reconnect">'+(state.page==='expired'?'返回设备并重新连接':'重新连接')+'</button></div>':local()?'<div class="aw-banner">'+icon('monitor')+'<span>本机浏览器 · 由示例账号在桌面打开</span><button type="button" class="aw-quiet" data-action="local-source">查看来源说明</button></div>':'';return banner+'<div class="aw-workspace '+(state.panel?'has-panel':'')+'"><div class="aw-conversation">'+(state.page==='home'?'<section class="aw-home"><h1>接下来，做点什么？</h1><p class="aw-muted aw-small" style="margin-top:10px">当前电脑：'+esc(state.deviceName)+'</p><div class="aw-recents"><p class="aw-small aw-muted">继续最近的工作</p><button type="button" data-action="session"><span>统一登录与工作区体验<br><span class="aw-small aw-muted">产品项目 · Codex</span></span>'+icon('arrow-up-right')+'</button><button type="button" data-action="session"><span>梳理文件预览交互<br><span class="aw-small aw-muted">产品项目 · Codex</span></span>'+icon('arrow-up-right')+'</button></div></section>':transcript())+composer()+'</div>'+(state.panel?panelView():'')+'</div>'}
 function localExpiredView(){return '<section class="aw-page aw-auth"><p class="aw-login-description">请从桌面端重新打开工作区。</p><p>在 AnyWork 桌面端点击“打开本地工作区”，重新授权当前浏览器。</p><div class="aw-actions"><button type="button" class="aw-primary" data-action="recheck-local">重新检查本机会话</button></div><div class="aw-line"></div><p class="aw-small">本机会话与 Web 账号相互独立。登录账号不会代替本机授权。</p><button type="button" class="aw-quiet" data-action="login">登录查看远程设备</button></section>'}
 function render(){frame.classList.toggle('auth-mode',['login','hosted'].includes(state.page));picker.value=state.page;sidebarView();header();content.innerHTML=active()?workView():state.page==='login'?loginView():state.page==='hosted'?hostedView():state.page==='local-expired'?localExpiredView():devicesView();icons()}
 function showDialog(title,body,actions){lastTrigger=document.activeElement;dialogTitle.textContent=title;dialogBody.innerHTML=body;dialogActions.innerHTML=actions;dialog.showModal();icons()}
 function closeDialog(){dialog.close();if(lastTrigger?.isConnected)lastTrigger.focus()}
 function keyDialog(changed=false){showDialog(changed?'这台电脑的公钥已改变':'确认这台电脑的身份','<p>请在工作电脑的“远程访问 → 本机身份核对”中，对照这里的设备身份与完整公钥。</p><p class="aw-muted">'+(changed?'客户端重启、重新安装或设备更换均可能导致公钥改变。确认原因前不要继续。':'首次连接需要你核对身份；在线状态不能代替身份确认。')+'</p><code>设备：工作电脑（示例）<br>身份：device-demo-01<br>公钥：示例公钥，仅用于设计评审</code><label class="aw-check"><input id="aw-web-key-check" type="checkbox">我已在电脑端核对身份与公钥</label>','<button type="button" data-action="cancel-key">取消</button><button type="button" class="aw-primary" data-action="confirm-key" disabled>确认并连接</button>')}
 function beginConnect(){go('connecting');message('');connectTimer=setTimeout(()=>{connectTimer=null;go('home');message('示例连接已建立，未访问真实设备。')},1800)}
 root.addEventListener('input',e=>{if(e.target.id==='aw-web-draft')state.draft=e.target.value;if(e.target.id==='aw-web-search'){state.query=e.target.value;sidebar.querySelectorAll('[data-session-label]').forEach(n=>n.hidden=!n.dataset.sessionLabel.includes(state.query))}});
 root.addEventListener('change',e=>{if(e.target===picker){closeDialog();state.approved=false;state.hiddenDevice=false;state.panel=null;go(e.target.value);if(['key','changed'].includes(state.page))keyDialog(state.page==='changed')}if(e.target.id==='aw-web-agent'){state.agent=e.target.value;message(state.agent==='all'?'显示当前电脑的所有 Agent 会话。':'显示 Codex 会话；示例列表均来自 Codex。')}if(e.target.id==='aw-web-key-check'){dialogActions.querySelector('[data-action="confirm-key"]').disabled=!e.target.checked}});
 root.addEventListener('keydown',e=>{if(e.target.id==='aw-web-draft'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&window.matchMedia('(pointer:fine)').matches){e.preventDefault();if(!disconnected())send()}if(e.key==='Escape'){state.deviceMenu=false;state.accountMenu=false;root.querySelectorAll('.aw-popover').forEach(n=>n.hidden=true)}});
 dialog.addEventListener('close',()=>{if(lastTrigger?.isConnected)lastTrigger.focus()});
 function send(){if(!state.draft.trim()){message('先输入一条消息。');root.querySelector('#aw-web-draft')?.focus();return}if(state.page==='approval'&&!state.approved){state.queue.push(state.draft);state.draft='';render();message('原型演示：消息已加入待发送队列。');return}state.draft='';go('conversation');message('原型演示：消息不会发送给真实 Agent。')}
 root.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target||target.disabled)return;const a=target.dataset.action;if(a==='open-nav'){frame.classList.add('nav-open');return}if(a==='close-nav'){frame.classList.remove('nav-open');return}if(a==='close-dialog'){closeDialog();return}if(a==='device-menu'){state.deviceMenu=!state.deviceMenu;sidebarView();icons();return}if(a==='account-menu'){state.accountMenu=!state.accountMenu;sidebarView();icons();return}if(a==='device-more'){const m=root.querySelector('#aw-web-device-more');if(m)m.hidden=!m.hidden;return}if(a==='devices'){if(active()){showDialog('返回我的设备？','<p>将断开当前页面到这台电脑的加密连接。电脑上的任务会继续执行。</p><p class="aw-muted">文字草稿按电脑和会话保存。未完成上传的附件不会自动带到另一台电脑。</p>','<button type="button" data-action="close-dialog">留在工作区</button><button type="button" class="aw-primary" data-action="leave-workspace">返回我的设备</button>')}else go('devices');return}if(a==='leave-workspace'){closeDialog();go('devices');return}if(a==='new'){go('home');return}if(a==='search'){state.search=!state.search;sidebarView();icons();root.querySelector('#aw-web-search')?.focus();return}if(a==='session'){go('conversation');return}if(a==='login'||a==='signup'){go('hosted');message(a==='signup'?'创建账号：托管注册页面的品牌示意。':'登录：将前往账号服务，原型不打开真实页面。');return}if(a==='login-back'){go('login');return}if(a==='finish-login'){go('devices');message('原型演示：授权完成，未执行真实登录。');return}if(a==='connect'){if(state.verified)beginConnect();else keyDialog();return}if(a==='cancel-key'){closeDialog();go('devices');return}if(a==='confirm-key'){if(!root.querySelector('#aw-web-key-check')?.checked)return;state.verified=true;closeDialog();beginConnect();return}if(a==='cancel-connect'){go('devices');message('已取消示例连接。');return}if(a==='refresh'){state.hiddenDevice=false;go('devices');message('原型演示：设备列表已刷新。');return}if(a==='add-device'){showDialog('添加一台电脑','<ol><li>在 Mac 上安装并打开 AnyWork 桌面端。</li><li>登录与当前页面相同的账号。</li><li>等待本地工作区就绪，远程访问将默认尝试开启。</li></ol><p class="aw-muted">如果曾手动关闭，请在电脑上重新开启。保持电脑开机联网，随后回到这里刷新。</p>','<button type="button" data-action="close-dialog">关闭</button><button type="button" class="aw-primary" data-action="download">下载桌面端</button>');return}if(a==='download'){message('原型演示：这里将打开桌面端下载页。');return}if(a==='rename'){showDialog('修改设备名称','<label>设备名称<input id="aw-web-device-name" type="text" maxlength="80" value="'+esc(state.deviceName)+'"></label><p class="aw-muted">用于在账号设备列表中识别这台电脑。</p>','<button type="button" data-action="close-dialog">取消</button><button type="button" class="aw-primary" data-action="save-name">保存名称</button>');return}if(a==='save-name'){const value=root.querySelector('#aw-web-device-name').value.trim();if(!value){message('请输入设备名称。');return}state.deviceName=value;closeDialog();render();message('原型演示：设备名称已更新。');return}if(a==='remove'){showDialog('移除设备显示？','<p>只从账号设备列表移除这条记录，不会关闭这台电脑的远程访问。</p><p class="aw-muted">要撤销访问，请在目标电脑上关闭远程访问。</p>','<button type="button" data-action="close-dialog">取消</button><button type="button" class="aw-primary" data-action="confirm-remove">移除显示</button>');return}if(a==='confirm-remove'){state.hiddenDevice=true;closeDialog();go('empty');message('原型演示：已移除显示，未撤销设备访问。');return}if(a==='offline-info'){message('这台电脑当前离线。请确认电脑开机联网，并在桌面端开启远程访问。');return}if(a.startsWith('panel-')){const type=a.slice(6);state.panel=state.panel===type?null:type;render();persist();return}if(a==='close-panel'){state.panel=null;render();persist();return}if(a==='reconnect'){if(state.page==='expired'){go('devices');message('重新选择电脑并建立新的授权连接。')}else{go('conversation');message('原型演示：连接已恢复，未自动重发任何消息。')}return}if(a==='send'){send();return}if(a==='approve'||a==='reject'){state.approved=true;render();message(a==='approve'?'原型演示：仅允许这一次操作。':'原型演示：已拒绝本次操作。');return}if(a==='approval-details'){message('原型仅展示“允许一次”。实际范围由当前审批请求提供。');return}if(a==='goal'){state.goal=!state.goal;render();message(state.goal?'原型演示：已展示目标状态。':'原型演示：目标已暂停。');return}if(a==='clear-queue'){state.queue=[];render();message('原型演示：已移除待发送消息。');return}if(a==='edit-queue'){if(state.queue.length)state.draft=state.queue.shift();render();root.querySelector('#aw-web-draft')?.focus();message('原型演示：队列消息已回到输入框。');return}if(a==='settings'){showDialog(active()?'设置与插件':'外观与语言','<div class="aw-settings-row"><div>外观<span>浅色、深色与跟随系统</span></div><select id="aw-web-appearance" aria-label="外观"><option value="normal">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div><div class="aw-settings-row"><div>语言<span>全局入口与工作区共用一份偏好</span></div><select aria-label="语言"><option>简体中文</option><option>English</option></select></div>'+(active()?'<div class="aw-settings-row"><div>Agent 与插件<span>连接和执行能力由当前电脑提供</span></div><span>Codex</span></div>':''),'<button type="button" class="aw-primary" data-action="save-settings">完成</button>');return}if(a==='save-settings'){const scheme=root.querySelector('#aw-web-appearance')?.value;root.style.colorScheme=scheme==='normal'?'':scheme;closeDialog();message('原型演示：外观已应用于统一外壳。');return}if(a==='logout'){showDialog('退出 Web 账号？','<p>当前网页的连接会断开，电脑上的任务继续执行。</p><p class="aw-muted">退出 Web 账号不会代替桌面端关闭远程访问。</p>','<button type="button" data-action="close-dialog">取消</button><button type="button" class="aw-primary" data-action="confirm-logout">退出账号</button>');return}if(a==='confirm-logout'){closeDialog();go('login');return}if(a==='end-local'){showDialog('退出本机网页会话？','<p>将关闭当前浏览器的本机会话及其终端。电脑上的工作和账号远程访问继续保留。</p>','<button type="button" data-action="close-dialog">取消</button><button type="button" class="aw-primary" data-action="confirm-end-local">退出本机会话</button>');return}if(a==='confirm-end-local'){closeDialog();go('local-expired');return}if(a==='local-source'){showDialog('本机打开来源','<p>由示例账号在桌面打开。</p><p class="aw-muted">这是打开时的公开来源快照，不能表示当前网页已登录该账号，也不能表示桌面账号和远程开关仍处于相同状态。</p>','<button type="button" class="aw-primary" data-action="close-dialog">知道了</button>');return}if(a==='recheck-local'){message('原型演示：尚未取得本机授权，请从桌面端重新打开。');return}if(a==='account-info'){message('示例账号 · 此处显示当前 Web 登录身份。');return}if(a==='help'){showDialog('如何继续工作','<p>在电脑上登录 AnyWork 并准备本地工作区。远程访问默认尝试开启，也可以随时关闭。</p><p>在其他设备登录同一账号，选择电脑，首次连接时核对身份。连接后在侧栏切换项目和会话。</p>','<button type="button" class="aw-primary" data-action="close-dialog">知道了</button>');return}const demos={'attach':'添加菜单：上传文件、添加远程文件、目标与计划模式。','copy-answer':'原型演示：回答已选择用于复制。','feedback':'原型演示：评价保存在 AnyWork 本地。','answer-more':'回答菜单：复制 Markdown、下载回答与管理本地评价。','edit-file':'原型演示：文件编辑在右侧进行，保留会话与草稿。','review-change':'原型演示：展开当前文件的 Git 差异。','terminal-demo':'原型演示：不会执行真实终端命令。'};if(demos[a])message(demos[a]);persist()});
 window.addEventListener('openai:set_globals',e=>{const restored=e.detail?.globals?.widgetState?.privateContent;if(restored?.revision===revision&&states.includes(restored.page)){state.page=restored.page;state.panel=['files','changes','terminal'].includes(restored.panel)?restored.panel:null;render()}});
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:frame,onChange:()=>{root.style.setProperty('--aw-sidebar',design.sidebar+'px');frame.style.minHeight=design.compact?'610px':'650px'}});tweak.addSlider(design,'sidebar',{label:'侧栏宽度',min:190,max:250,step:10,unit:'px'});tweak.addToggle(design,'compact',{label:'紧凑窗口'});}
})();
