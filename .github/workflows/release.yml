name: Build releases
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after every platform succeeds
        type: boolean
        default: false
      tag:
        description: Existing immutable release tag (must match source version and commit)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Require trusted exact-source Checks before publishing builds
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: |
          tag="${RELEASE_TAG:-v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')}"
          python3 scripts/check-release-ci.py --sha "$GITHUB_SHA" --tag "$tag"
      - name: Validate embedded versions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        run: |
          tag="${RELEASE_TAG:-v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')}"
          if [ "$PUBLISH" = true ]; then
            python3 scripts/check-release-version.py "$tag" --remote
          else
            python3 scripts/check-release-version.py "$tag"
          fi
  desktop:
    needs: version
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: macos-arm64, bundle: app}
          - {os: macos-15-intel, platform: macos-x86_64, bundle: app}
          - {os: ubuntu-22.04, platform: linux-x86_64, bundle: appimage}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, bundle: appimage}
          - {os: windows-latest, platform: windows-x86_64, bundle: nsis}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
          cache-on-failure: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev patchelf libfuse2
      - run: npm ci
      - run: npm run build
      - run: npm run build:desktop-ui
      - name: Build native applications
        run: cargo build --locked --release -p anywork -p anywork-desktop
      - name: Smoke test server executable
        run: ./target/release/anywork --version
      - name: Test native applications
        run: cargo test --locked --release -p anywork -p anywork-desktop
      - name: Package application and source
        if: runner.os != 'macOS'
        run: python3 scripts/release-package.py --platform ${{ matrix.platform }}
      - name: Stage resources for native updates
        run: python3 scripts/updater-artifacts.py prepare
      - name: Build signed native updater bundle
        working-directory: crates/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri bundle --ci --bundles ${{ matrix.bundle }} --config tauri.bundle.conf.json
      - name: Create macOS drag-and-drop installer with installation guide
        if: runner.os == 'macOS'
        run: python3 scripts/build-macos-dmg.py --platform ${{ matrix.platform }}
      - name: Collect version-bound update signatures
        run: python3 scripts/updater-artifacts.py collect --platform ${{ matrix.platform }}
      - name: Mount and verify macOS installer
        if: runner.os == 'macOS'
        run: python3 scripts/check-macos-dmg.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release-ndk27
      - run: npm ci
      - name: Restore Android release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo 'Android release signing secret is required.' >&2; exit 1; fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/anywork-release.jks"
      - name: Build and verify Android
        env:
          ANYWORK_ANDROID_KEYSTORE: ${{ runner.temp }}/anywork-release.jks
          ANYWORK_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANYWORK_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANYWORK_ANDROID_KEY_ALIAS: anywork
        run: ./scripts/build-android.sh --release --target aarch64,armv7,i686,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/anywork-android.apk
          if-no-files-found: error
          retention-days: 14
  source-web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: python3 scripts/source-archive.py && python3 scripts/source-archive-test.py
      - run: mkdir -p release && cp artifacts/anywork-source.tar.gz release/ && tar -czf release/anywork-web.tar.gz -C web dist
      - uses: actions/upload-artifact@v4
        with:
          name: source-web
          path: release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [desktop, android, source-web]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-stable-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: |
          python3 ../scripts/updater-artifacts.py manifest
          sha256sum anywork-* latest.json > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          RELEASE_TAG="${RELEASE_TAG:-v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')}"
          python3 scripts/check-release-version.py "$RELEASE_TAG" --remote
          python3 scripts/check-release-ci.py --sha "$RELEASE_COMMIT" --tag "$RELEASE_TAG" --timeout 60 --poll 5
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "AnyWork $RELEASE_TAG" --notes-file docs/release-notes.md
          gh workflow run vercel.yml --ref main
