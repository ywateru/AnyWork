name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build focused browser prerequisites
        run: |
          npm run build:desktop-ui
          npm run build:mobile-ui
          cargo build --locked -p anywork
          npm run build
      - name: Check sidebar gestures and model picker focus early
        run: npx playwright test e2e/sidebar-scroll.spec.ts e2e/model-picker.spec.ts
      - run: ./scripts/check.sh
      - run: npm run format:check
      - run: python3 scripts/build-site.py && node scripts/site-test.mjs
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: qualified-python
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: checks-windows-x86_64
          cache-on-failure: true
      - run: npm ci
      - run: npm run build:desktop-ui
      - name: Build native applications
        run: cargo build --locked --release -p anywork -p anywork-desktop
      - name: Test native applications
        env:
          ANYWORK_TEST_PYTHON: ${{ steps.qualified-python.outputs.python-path }}
        run: cargo test --locked --release -p anywork -p anywork-desktop -p remote-agent-sdk
  macos-native:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-x86_64-desktop
          cache-on-failure: true
      - run: npm ci
      - run: npm run build
      - run: npm run build:desktop-ui
      - name: Build native applications
        run: cargo build --locked --release -p anywork -p anywork-desktop
      - name: Test native applications
        run: cargo test --locked --release -p anywork -p anywork-desktop
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64-ndk27
      - run: npm ci
      - run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: anywork-android-debug
          path: artifacts/anywork-android-debug.apk
          if-no-files-found: error
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export reviewed corresponding source
        run: python3 scripts/source-archive.py
      - name: Clean server-only container build and isolated acceptance
        run: python3 scripts/container-smoke-test.py --build
      - name: Keep scrubbed container build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-build-diagnostics
          path: artifacts/container-build-diagnostics.log
          if-no-files-found: ignore
          retention-days: 7
