name: Publish Vercel website
on:
  push:
    branches: [main]
    paths: ['site/**', 'web/**', 'scripts/build-site.py', 'scripts/assemble-vercel.py', 'vercel.json', 'package*.json', '.github/workflows/vercel.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vercel-production
  cancel-in-progress: false
jobs:
  deploy:
    env:
      VITE_ACCOUNT_PORTAL_URL: ${{ vars.VITE_ACCOUNT_PORTAL_URL }}
      VITE_LOGTO_ENDPOINT: ${{ vars.VITE_LOGTO_ENDPOINT }}
      VITE_LOGTO_APP_ID: ${{ vars.VITE_LOGTO_APP_ID }}
      VITE_LOGTO_RESOURCE: ${{ vars.VITE_LOGTO_RESOURCE }}
      VITE_CYBERGRID_URL: ${{ vars.VITE_CYBERGRID_URL }}
      VITE_CYBERGRID_NATIVE_APP_ID: ${{ vars.VITE_CYBERGRID_NATIVE_APP_ID }}
    runs-on: ubuntu-latest
    steps:
      - name: Require account and transport acceptance
        env:
          ACCOUNT_READY: ${{ vars.ANYWORK_ACCOUNT_READY }}
        run: |
          if [ "$ACCOUNT_READY" != true ]; then
            echo 'Account/transport acceptance is pending (Development Logto is supported). See docs/cloud-configuration.md.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Bind build to the checked-out source
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install Vercel CLI
        run: npm install --global vercel@50.28.0
      - name: Pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Bind complete public configuration and CSP
        run: python3 scripts/cloud/prepare-frontend.py
      - name: Build exact source and immutable release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy verified prebuilt output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
